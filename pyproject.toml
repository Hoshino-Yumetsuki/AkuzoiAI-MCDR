[project]
name = "akuzoiai-mcdr"
version = "0.1.0"
description = "AI assistant MCDR plugin - controls the server via tool-calling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "haystack-ai>=2.28.0",
    "mcdreforged>=2.14.0",
]

[[tool.uv.index]]
url = "https://mirrors.ustc.edu.cn/pypi/web/simple"
default = true

[tool.ty.rules]
# ChatOpenAI / OpenAIChatGenerator use **kwargs + Pydantic — ty cannot infer parameters
unknown-argument = "ignore"
# ty incorrectly flags dataclass field() default_factory as a type expression
invalid-type-form = "ignore"
# Haystack @tool(inputs_from_state=...) is a valid overloaded decorator — ty can't infer it
call-non-callable = "ignore"
